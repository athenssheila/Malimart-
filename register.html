<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>

    <link rel="stylesheet" href="css/register.css">
</head>

<body>
    <form action="">

        <legend style="text-align: center; background-color: brown; color: antiquewhite;">Join Us Today!</legend>
        <br>

        <label for="fullname">Fullname :</label>
        <input type="text" id="fullname" placeholder="e.g Laura" required>
        <br></br>

        <label for="email">Email Address :</label>
        <input type="text" id="email" placeholder="e.g lora@gmail.com" required>
        <br><br>

        <label for="pwd">Password :</label>
        <input type="text" id="pwd" placeholder="Enter your password" required>
        <br><br>

        <label for="phone">Phone Number</label> :</label>
        <input type="tel" id="phone" placeholder="0740625630" required>
        <br><br>

        <label for="dob">Birthday:</label>
        <input type="date" id="dob" placeholder="e.g Lora@gmail.com" required>
        <br><br>

        <label for="dt">Date and Time :</label>
        <input type="datetime-local" id="dt" placeholder="e.g Lora@gmail.com" required>
        <br><br>


        <label for="upload">Upload File:</label>
        <input type=" file " id="file " placeholder="e.g Lora@gmail.com " required>
        <br><br> >

        <!--Dropdown-->


        <!--Rdiobutton-->


        <!--Checkbox-->


        <!---Textarea-->


        <button>Register now</button>


    </form>



</body>

</html>
